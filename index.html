<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Crash Combo</title>
  <meta name="description" content="The Crash Combo. Follow us on Facebook for shows and news.">
  <meta property="og:title" content="The Crash Combo">
  <meta property="og:url" content="https://crashcombo.com/">
  <meta property="og:image" content="https://crashcombo.com/logo.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .badge {
      width: min(80vw, 70vh, 560px);
      aspect-ratio: 1;
      border: 3px solid #fff;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .badge img { width: 60%; height: auto; display: block; }
    .social {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .social a {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: .6rem 1.3rem .6rem .7rem;
      border: 2px solid #fff;
      border-radius: 999px;
      transition: background .15s, color .15s;
    }
    .social img { width: 28px; height: 28px; display: block; }
    .social a:hover, .social a:focus-visible { background: #fff; color: #000; outline: none; }
  </style>
</head>
<body>
  <main class="badge">
    <img src="logo.png" alt="The Crash Combo" width="1049" height="1101">
  </main>
  <nav class="social" aria-label="The Crash Combo on social media">
    <a href="https://www.facebook.com/crashcombo" rel="noopener">
      <img src="images/social/fb.png" alt="" width="28" height="28">
      Facebook
    </a>
    <a href="https://www.instagram.com/thecrashcombo/" rel="noopener">
      <img src="images/social/ig.png" alt="" width="28" height="28">
      Instagram
    </a>
  </nav>
</body>
</html>
